{{- '\"parameters\": ' }}\n            {{- tool_call.arguments | tojson }}\n            {{- \"}\" }}\n        {%- endif %}\n        {%- if builtin_tools is defined %}\n            {#- This means we're in ipython mode #}\n            {{- \"<|eom_id|>\" }}\n        {%- else %}\n            {{- \"<|eot_id|>\" }}\n        {%- endif %}\n    {%- elif message.role == \"tool\" or message.role == \"ipython\" %}\n        {{- \"<|start_header_id|>ipython<|end_header_id|>\\n\\n\" }}\n        {%- if message.content is mapping or message.content is iterable %}\n            {{- message.content | tojson }}\n        {%- else %}\n            {{- message.content }}\n        {%- endif %}\n        {{- \"<|eot_id|>\" }}\n    {%- endif %}\n{%- endfor %}\n{%- if add_generation_prompt %}\n    {{- '<|start_header_id|>assistant<|end_header_id|>\\n\\n' }}\n{%- endif %}\n"

dataset_prepared_path: /gpfs/scratch/ehu26/ehu129750/metalinguistika/training/CP/cache/dataset_cache

shuffle_merged_datasets: true

output_dir: /gpfs/scratch/ehu26/ehu129750/metalinguistika/training/CP/cache/model/CP

sequence_len: 8192
excess_length_strategy: truncate
sample_packing: true
val_set_size: 0.0
pad_to_sequence_len: true

special_tokens:
   pad_token: <|end_of_text|>

# neftune_noise_alpha: 5 # https://huggingface.co/docs/trl/sft_trainer#enhance-the-models-performances-using-neftune

# gradient_accumulation_steps: 8
warmup_ratio: 0.1
micro_batch_size: 1
num_epochs: 1
# sweep 5e-6, and X4 data
learning_rate: 1e-5
max_grad_norm: 1.0
cosine_min_lr_ratio: 0.1

# Llama 3 reccomended
optimizer: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1e-8
lr_scheduler: cosine
weight_decay: 0.1

gradient_checkpointing: true
deepspeed: /gpfs/scratch/ehu26/ehu129750/metalinguistika/training/CP/scripts/0-train_configs/common/deepspeed_config-70B-STAGE3.json

train_on_inputs: false
group_by_length: false
bf16: true
fp16: false
tf32: true

logging_steps: 1
attn_implementation: flash_attention_4

save_strategy: "no"
# saves_per_epoch: 1
# save_total_limit: 1

seed: 33

plugins:
  - axolotl.integrations.liger.LigerPlugin
liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
liger_fused_linear_cross_entropy: true
